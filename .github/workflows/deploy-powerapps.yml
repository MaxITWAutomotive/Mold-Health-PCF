# Imports MoldHealthSolution.zip into a Dataverse environment after a successful build.
#
# Setup (one time): https://learn.microsoft.com/power-platform/alm/tutorials/github-actions-start
#   1. Entra app registration → note Application (client) id + Directory (tenant) id
#   2. Client secret → GitHub repo secret PP_CLIENT_SECRET
#   3. PP Admin Center → Environment → Settings → Application users → New app user
#      (same app, System Administrator on Max Environment)
#   4. GitHub repo Settings → Secrets and variables → Actions:
#        Secret  PP_CLIENT_ID      = Application (client) id
#        Secret  PP_TENANT_ID      = Directory (tenant) id
#        Secret  PP_CLIENT_SECRET  = Client secret value
#        Variable PP_ENVIRONMENT_URL = https://<org>.crm.dynamics.com  (Max Environment)
#   5. Optional variable PP_AUTO_DEPLOY = true  → deploy automatically after Build PCF on main
#
# Manual: Actions → "Deploy PCF to Power Apps" → Run workflow
name: Deploy PCF to Power Apps

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build PCF"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: >
      (github.event_name == 'workflow_dispatch') ||
      (github.event.workflow_run.conclusion == 'success' &&
       vars.PP_AUTO_DEPLOY == 'true')
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read

    steps:
      - name: Download solution artifact from Build PCF
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: MoldHealthSolution
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          path: artifact

      - name: Checkout (manual run — build inline)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4

      - name: Setup Node
        if: github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup .NET
        if: github.event_name == 'workflow_dispatch'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build solution zip (manual run)
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          foreach ($dir in @('MoldHealth', 'MoldMakerDataCard')) {
            Push-Location $dir
            npm ci
            npm run build
            Pop-Location
          }
          Push-Location MoldHealthSolution
          dotnet restore
          dotnet build -c Release
          Pop-Location
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item MoldHealthSolution/bin/Release/MoldHealthSolution.zip artifact/

      - name: Verify credentials configured
        shell: pwsh
        run: |
          if (-not "${{ vars.PP_ENVIRONMENT_URL }}") { throw "Set repository variable PP_ENVIRONMENT_URL" }
          if (-not "${{ secrets.PP_CLIENT_ID }}") { throw "Set secret PP_CLIENT_ID" }
          if (-not "${{ secrets.PP_TENANT_ID }}") { throw "Set secret PP_TENANT_ID" }
          if (-not "${{ secrets.PP_CLIENT_SECRET }}") { throw "Set secret PP_CLIENT_SECRET" }
          if (-not (Test-Path "artifact/MoldHealthSolution.zip")) { throw "Missing artifact/MoldHealthSolution.zip" }

      - name: Import solution and publish
        uses: microsoft/powerplatform-actions/import-solution@v1
        with:
          environment-url: ${{ vars.PP_ENVIRONMENT_URL }}
          app-id: ${{ secrets.PP_CLIENT_ID }}
          tenant-id: ${{ secrets.PP_TENANT_ID }}
          client-secret: ${{ secrets.PP_CLIENT_SECRET }}
          solution-file: artifact/MoldHealthSolution.zip
          force-overwrite: true
          publish-changes: true
          run-asynchronously: true
          max-async-wait-time: "90"
