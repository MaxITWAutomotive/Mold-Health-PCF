name: Build PCF

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install dependencies (MoldMakerDataCard)
        working-directory: ./MoldMakerDataCard
        run: npm ci

      - name: Lint PCF (MoldMakerDataCard)
        working-directory: ./MoldMakerDataCard
        run: npm run lint

      - name: Build PCF (MoldMakerDataCard)
        working-directory: ./MoldMakerDataCard
        run: npm run build

      - name: Install dependencies (PartDocumentationCard)
        working-directory: ./PartDocumentationCard
        run: npm ci

      - name: Lint PCF (PartDocumentationCard)
        working-directory: ./PartDocumentationCard
        run: npm run lint

      - name: Build PCF (PartDocumentationCard)
        working-directory: ./PartDocumentationCard
        run: npm run build

      - name: Restore Solution
        working-directory: ./MaxCustomPCFs
        run: dotnet restore

      - name: Build Solution
        working-directory: ./MaxCustomPCFs
        run: dotnet build -c Release

      - name: Verify solution zip includes PCF assets
        shell: pwsh
        run: |
          $zip = "MaxCustomPCFs/bin/Release/MaxCustomPCFs.zip"
          if (-not (Test-Path $zip)) { throw "Missing solution zip: $zip" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $entries = @([System.IO.Compression.ZipFile]::OpenRead($zip).Entries.FullName)
          $entries | ForEach-Object { Write-Host $_ }
          if (-not ($entries | Where-Object { $_ -match 'Controls/.+/ControlManifest\.xml' })) {
            throw "Solution zip does not contain PCF Controls folder. Import would succeed but the code component would not appear in canvas apps."
          }
          if (-not ($entries | Where-Object { $_ -match 'Controls/.+/bundle\.js' })) {
            throw "Solution zip is missing bundle.js for the PCF control."
          }
          if (-not ($entries | Where-Object { $_ -match 'Controls/itw_ITW\.Controls\.MoldMakerDataCard/ControlManifest\.xml' })) {
            throw "Solution zip is missing MoldMakerDataCard code component."
          }
          if (-not ($entries | Where-Object { $_ -match 'Controls/itw_ITW\.Controls\.PartDocumentationCard/ControlManifest\.xml' })) {
            throw "Solution zip is missing PartDocumentationCard code component."
          }

      - name: Upload Solution
        uses: actions/upload-artifact@v4
        with:
          name: MaxCustomPCFs
          path: MaxCustomPCFs/bin/Release/MaxCustomPCFs.zip

      - name: Import instructions (no local build / no service principal)
        shell: pwsh
        run: |
          @"
          ## Max Custom PCFs built successfully

          **No admin PC / no Client ID:** use this zip in the browser (no .NET or pac on your machine).

          1. Download artifact **MaxCustomPCFs** from this workflow run (right panel → Artifacts).
          2. Open [Power Apps](https://make.powerapps.com) → **Solutions** → **Import**.
          3. Select **MaxCustomPCFs.zip** → publisher **ITW** → finish → **Publish all customizations**.
          4. In Studio: **Add (+)** → **Get more components** → **Code** → **MoldMakerDataCard** and **PartDocumentationCard**.

          **VS Code only (optional):** Power Platform Tools extension + `pac auth create` (your user login, no app registration) + `pac pcf push --publisher-prefix itw` after `npm run build` in one PCF folder — no full solution build required on your PC.
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8

