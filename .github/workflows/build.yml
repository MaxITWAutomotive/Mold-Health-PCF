name: Build PCF

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install dependencies (MoldHealth)
        working-directory: ./MoldHealth
        run: npm ci

      - name: Build PCF (MoldHealth)
        working-directory: ./MoldHealth
        run: npm run build

      - name: Install dependencies (MoldMakerDataCard)
        working-directory: ./MoldMakerDataCard
        run: npm ci

      - name: Build PCF (MoldMakerDataCard)
        working-directory: ./MoldMakerDataCard
        run: npm run build

      - name: Restore Solution
        working-directory: ./MoldHealthSolution
        run: dotnet restore

      - name: Build Solution
        working-directory: ./MoldHealthSolution
        run: dotnet build -c Release

      - name: Verify solution zip includes PCF assets
        shell: pwsh
        run: |
          $zip = "MoldHealthSolution/bin/Release/MoldHealthSolution.zip"
          if (-not (Test-Path $zip)) { throw "Missing solution zip: $zip" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $entries = [System.IO.Compression.ZipFile]::OpenRead($zip).Entries.FullName
          $entries | ForEach-Object { Write-Host $_ }
          if ($entries -notmatch 'Controls/.+/ControlManifest\.xml') {
            throw "Solution zip does not contain PCF Controls folder. Import would succeed but the code component would not appear in canvas apps."
          }
          if ($entries -notmatch 'Controls/.+/bundle\.js') {
            throw "Solution zip is missing bundle.js for the PCF control."
          }
          if ($entries -notmatch 'Controls/itw_ITW\.Controls\.MoldMakerDataCard/ControlManifest\.xml') {
            throw "Solution zip is missing MoldMakerDataCard code component."
          }

      - name: Upload Solution
        uses: actions/upload-artifact@v4
        with:
          name: MoldHealthSolution
          path: MoldHealthSolution/bin/Release/MoldHealthSolution.zip


